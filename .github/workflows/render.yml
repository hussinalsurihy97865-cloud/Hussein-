name: Render Remotion Ad (Vertical & Landscape)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & Whisper Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install numpy openai-whisper

      - name: Audio Envelope, Music & Whisper Alignment
        run: python3 scripts/prepare_audio_and_whisper.py

      - name: Install Node Packages
        run: npm install

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render Still Frames
        run: npm run render:stills

      - name: Render Vertical Ad (1080x1920)
        run: npm run render:vertical

      - name: Render Landscape Ad (1920x1080)
        run: npm run render:landscape

      - name: Upload Rendered Videos & Stills
        uses: actions/upload-artifact@v4
        with:
          name: Eshrahli-Rendered-Ads
          path: |
            out/Ad-Vertical.mp4
            out/Ad-Landscape.mp4
            out/check-vertical.png
            out/check-landscape.png
